name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  # release-please.yml runs these checks on a release before publishing it to npm.
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: a new Prettier release may format differently.
      - name: Check formatting
        run: npx --yes prettier@3.9.10 --check .

  plugins:
    strategy:
      # One failing OS should not hide whether the others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The plugin loop is POSIX shell; Windows runners default to PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Function hooks are early access, so the engine is pinned and bumped on purpose.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate and test each plugin
        run: |
          for dir in */; do
            [ -f "$dir/.claude-plugin/plugin.json" ] || continue
            echo "== $dir"
            claude plugin validate --strict "$dir"
            claude plugin test "$dir"
          done
      # The npm package's installer, packed and run as a person runs it, each time
      # against a Claude configuration of its own: a fresh one, the same one again,
      # and one where the desktop app added the marketplace by its URL. It installs
      # the plugin from the marketplace on GitHub; this checks the installer.
      - name: Install with npx
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/$(cd desktop-statusline && npm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          install() { npx --yes --package "file:$tgz" desktop-statusline; }
          installed() { claude plugin list --json | grep '"desktop-statusline@claude-mods"' >/dev/null; }

          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-fresh"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          install
          installed
          install

          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-desktop"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add https://github.com/jiroamato/claude-mods.git
          install
          installed
