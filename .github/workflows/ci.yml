name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned: a new Prettier release may format differently.
      - name: Check formatting
        run: npx --yes prettier@3.9.10 --check .

  plugins:
    strategy:
      # One failing OS should not hide whether the others pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The plugin loop is POSIX shell; Windows runners default to PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Function hooks are early access, so the engine is pinned and bumped on purpose.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate and test each plugin
        run: |
          for dir in */; do
            [ -f "$dir/.claude-plugin/plugin.json" ] || continue
            echo "== $dir"
            claude plugin validate --strict "$dir"
            claude plugin test "$dir"
          done
